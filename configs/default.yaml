seed: 42

data:
  num_samples: 200
  volume_size: 32
  defect_probability: 0.85
  train_fraction: 0.70
  validation_fraction: 0.15

defects:
  types: [sphere, ellipsoid, crack]
  min_radius: 2
  max_radius: 6
  intensity_min: -1.0
  intensity_max: -0.35

model:
  latent_channels: 32
  dropout: 0.10

training:
  epochs: 80
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 12

output:
  directory: results
